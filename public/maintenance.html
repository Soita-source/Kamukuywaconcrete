<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporarily Unavailable</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #f4f7fb 0%, #eef2f8 100%);
            color: #1f2937;
            padding: 24px;
        }

        .card {
            width: min(640px, 100%);
            background: #ffffff;
            border: 1px solid #d8e0ea;
            border-radius: 14px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.75rem;
            line-height: 1.2;
        }

        p {
            margin: 8px 0;
            line-height: 1.6;
        }

        .code {
            display: inline-block;
            margin-top: 14px;
            padding: 6px 10px;
            border-radius: 6px;
            background: #eef2f7;
            border: 1px solid #d6dce7;
            font-family: "Courier New", monospace;
            font-size: 0.9rem;
            color: #334155;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>This website is temporarily unavailable</h1>
        <p>We are currently carrying out maintenance.</p>
        <p>Please check back later.</p>
        <div class="code">HTTP 503 - Service Unavailable</div>
    </main>
</body>
</html>
